# Builds an installable Android APK on every push to main and publishes it to the
# "latest" GitHub release. Free on public repos; no Expo account needed.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**', '.claude/**']
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      - name: Build release APK
        working-directory: android
        # The prebuild template signs release builds with the debug key, which is fine for sideloading.
        # For Play Store releases, use EAS Build or add a real keystore.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk STILL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STILL-apk
          path: STILL.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest STILL.apk --title "STILL (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Install on Android: download STILL.apk, open it, allow installs from your browser or files app." \
            --latest
